---
- name: Deploy website to Apache server
  hosts: localhost
  connection: local
  become: true

  vars:
    web_root: /var/www/html
    service_name: apache2

  tasks:
    - name: Copy latest index.html
      copy:
        src: "{{ playbook_dir }}/index.html"
        dest: "{{ web_root }}/index.html"

    - name: Start Apache service
      service:
        name: "{{ service_name }}"
        state: started
        enabled: yes
